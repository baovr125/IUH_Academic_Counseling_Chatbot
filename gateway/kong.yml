_format_version: "3.0"

plugins:
  - name: rate-limiting
    config:
      minute: 1000
      policy: local
  - name: rate-limiting
    route: tts-routes
    config:
      minute: 100
      policy: local
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - "*"
      credentials: true
      max_age: 3600

consumers:
  - username: auth-issuer
    custom_id: auth-issuer
    
jwt_secrets:
  - consumer: auth-issuer
    key: "auth-issuer-key"
    secret: "super-secret-key-iuh-chatbot-2026"
    algorithm: HS256

upstreams:
  - name: chatbot-upstream
    algorithm: least-connections
    healthchecks:
      active:
        http_path: /health
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
      passive:
        healthy:
          successes: 5
        unhealthy:
          http_failures: 3

targets:
  - upstream: chatbot-upstream
    target: "academic-chatbot-service:8002"
    weight: 100

services:
  - name: auth-service
    url: http://auth-service:8001
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
          - /api/auth
        strip_path: false

  - name: academic-chatbot-service
    host: chatbot-upstream
    port: 8002
    connect_timeout: 60000
    read_timeout: 600000
    write_timeout: 600000
    routes:
      - name: chat-routes
        paths:
          - /api/v1/chat
          - /api/chat
        strip_path: false
        plugins:
          - name: jwt

  - name: realtime-translation-service
    url: http://realtime-translation-service:8003
    connect_timeout: 60000
    read_timeout: 180000
    write_timeout: 180000
    routes:
      - name: tts-routes
        paths:
          - /api/v1/translate/tts
          - /api/translate/tts
        strip_path: false
      - name: translation-routes
        paths:
          - /api/v1/translate
          - /api/translate
        strip_path: false

  - name: doc-translation-service
    url: http://doc-translation-service:8004
    connect_timeout: 60000
    read_timeout: 300000
    write_timeout: 300000
    routes:
      - name: doc-routes
        paths:
          - /api/v1/documents
          - /api/documents
        strip_path: false
        plugins:
          - name: jwt

  - name: flashcard-service
    url: http://flashcard-service:8005
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: flashcard-routes
        paths:
          - /api/v1/flashcards
          - /api/flashcards
          - /api/v1/decks
          - /api/v1/cards
        strip_path: false
        plugins:
          - name: jwt
