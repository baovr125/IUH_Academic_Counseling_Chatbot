# Kong declarative config (TEMPLATE).
# Không chứa bí mật: các placeholder __JWT_SECRET_KEY__ và __PUBLIC_ORIGIN__ được thay bằng `sed`
# khi container Kong khởi động (xem docker-compose*.yml) rồi ghi ra /tmp/kong.yml.
_format_version: "3.0"

plugins:
  - name: rate-limiting
    config:
      minute: 1000
      policy: local
  - name: rate-limiting
    route: tts-routes
    config:
      minute: 100
      policy: local
  - name: cors
    config:
      origins:
        - "http://localhost"
        - "http://127.0.0.1"
        - "http://localhost:3000"
        - "http://localhost:5173"
        - "http://127.0.0.1:3000"
        - "http://127.0.0.1:5173"
        - "__PUBLIC_ORIGIN__"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Accept
        - X-Request-ID
      credentials: false
      max_age: 3600
  # Gắn X-Request-ID (nếu client chưa gửi) để truy vết một yêu cầu xuyên Kong → service.
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
  # Không bao giờ chuyển tiếp header danh tính do client tự khai báo xuống service.
  - name: request-transformer
    config:
      remove:
        headers:
          - X-User-ID
          - X-User-Role
          - X-Consumer-ID
          - X-Consumer-Custom-ID
          - X-Consumer-Username

consumers:
  - username: auth-issuer
    custom_id: auth-issuer
    
jwt_secrets:
  - consumer: auth-issuer
    key: "iuh-auth-service"
    secret: "__JWT_SECRET_KEY__"
    algorithm: HS256

upstreams:
  - name: chatbot-upstream
    algorithm: least-connections
    healthchecks:
      active:
        http_path: /health
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
      passive:
        healthy:
          successes: 5
        unhealthy:
          http_failures: 3

targets:
  - upstream: chatbot-upstream
    target: "academic-chatbot-service:8002"
    weight: 100

services:
  - name: auth-service
    url: http://auth-service:8001
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
          - /api/auth
        strip_path: false
      # Đăng nhập/đăng ký: giới hạn chặt hơn nhiều so với mức chung để chống dò mật khẩu.
      - name: auth-credential-routes
        paths:
          - /api/v1/auth/login
          - /api/auth/login
          - /api/v1/auth/register
          - /api/auth/register
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              hour: 100
              policy: local

  - name: academic-chatbot-service
    host: chatbot-upstream
    port: 8002
    connect_timeout: 60000
    read_timeout: 600000
    write_timeout: 600000
    routes:
      - name: admin-routes
        paths:
          - /api/admin
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
              maximum_expiration: 86400
              uri_param_names:
                - jwt
                - token
      - name: chat-routes
        paths:
          - /api/v1/chat
          - /api/chat
        strip_path: false
        plugins:
          - name: jwt
            config: # Token qua ?token=/?jwt= chỉ để phục vụ EventSource (SSE) không gắn được header
              claims_to_verify:
                - exp
              maximum_expiration: 86400
              uri_param_names:
                - jwt
                - token

  - name: realtime-translation-service
    url: http://realtime-translation-service:8003
    connect_timeout: 60000
    read_timeout: 180000
    write_timeout: 180000
    routes:
      # TTS và audio được phát bằng thẻ <audio>/new Audio(url) nên không gắn được header Authorization;
      # giữ mở nhưng có rate-limit riêng (xem plugin tts-routes ở đầu file).
      - name: tts-routes
        paths:
          - /api/v1/translate/tts
          - /api/translate/tts
          - /api/v1/translate/audio
          - /api/translate/audio
        strip_path: false
      - name: translation-routes
        paths:
          - /api/v1/translate
          - /api/translate
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
              maximum_expiration: 86400
      # Từ điển admin: trước đây frontend gọi thẳng cổng 8003 (bỏ qua Kong).
      - name: dictionary-admin-routes
        paths:
          - /api/v1/admin/dictionary
          - /api/admin/dictionary
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
              maximum_expiration: 86400

  - name: doc-translation-service
    url: http://doc-translation-service:8004
    connect_timeout: 60000
    read_timeout: 3600000 # FIX-AGENT: Tăng timeout cho luồng SSE dài
    write_timeout: 3600000 # FIX-AGENT: Tăng timeout cho luồng SSE dài
    routes:
      - name: doc-routes
        paths:
          - /api/v1/documents
          - /api/documents
        strip_path: false
        plugins:
          - name: jwt
            config: # Token qua ?token=/?jwt= chỉ để phục vụ EventSource (SSE) không gắn được header
              claims_to_verify:
                - exp
              maximum_expiration: 86400
              uri_param_names:
                - jwt
                - token

  - name: flashcard-service
    url: http://flashcard-service:8005
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: flashcard-routes
        paths:
          - /api/v1/flashcards
          - /api/flashcards
          - /api/v1/decks
          - /api/v1/cards
        strip_path: false
        plugins:
          - name: jwt
            config: # Token qua ?token=/?jwt= chỉ để phục vụ EventSource (SSE) không gắn được header
              claims_to_verify:
                - exp
              maximum_expiration: 86400
              uri_param_names:
                - jwt
                - token
      # Sinh từ vựng bằng AI: tốn quota LLM nên giới hạn chặt hơn mức chung (đường dẫn dài hơn nên được khớp trước).
      - name: flashcard-vocabulary-routes
        paths:
          - /api/v1/flashcards/vocabulary
          - /api/flashcards/vocabulary
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
              maximum_expiration: 86400
              uri_param_names:
                - jwt
                - token
          - name: rate-limiting
            config:
              minute: 6
              hour: 60
              policy: local
