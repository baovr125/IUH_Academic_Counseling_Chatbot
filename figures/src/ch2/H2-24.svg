<!-- H2-24 Tìm kiếm chùm B = 2 (số liệu minh họa: log-xác suất tự đặt). Điểm chuẩn hóa = tổng log P / độ dài (α = 1). -->
<svg xmlns="http://www.w3.org/2000/svg" width="586" height="282" viewBox="0 0 586 282">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text class="t-sm t-muted" x="8" y="12">Câu nguồn: “học phí”   ·   số trong ngoặc: tổng log P của giả thuyết</text>
  <text class="t-sm t-b t-c" x="160" y="34">Bước 1</text><text class="t-sm t-b t-c" x="330" y="34">Bước 2</text><text class="t-sm t-b t-c" x="500" y="34">Bước 3</text>
  <g transform="translate(0,20)">
  <rect class="box infra" x="8" y="124" width="56" height="26"/><text class="t-sm t-c t-mono" x="36" y="137">&lt;s&gt;</text>

