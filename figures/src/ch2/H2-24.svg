  <rect class="box fe" x="426" y="114" width="156" height="28" style="stroke-width:2.4"/><text class="t-sm t-c" x="504" y="128">Tuition fee &lt;/s&gt; (−1,5)</text>
  <rect class="box gw" x="426" y="152" width="156" height="28" style="opacity:0.45"/><text class="t-sm t-c t-muted" x="504" y="166">Tuition fee is (−2,6)</text>

  </g>
  <text class="t-sm" x="8" y="252">Khung đậm: B = 2 giả thuyết được giữ lại ở mỗi bước · khung mờ: bị loại</text>
  <text class="t-sm" x="8" y="270">Chuẩn hóa độ dài (α = 1): −1,0 / 3 ≈ −0,33 và −1,5 / 3 = −0,50 → chọn “The tuition fee”</text>
