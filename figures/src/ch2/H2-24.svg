  <rect class="box fe" x="260" y="126" width="140" height="28" style="stroke-width:2.4"/><text class="t-sm t-c" x="330" y="140">Tuition fee (−1,1)</text>
  <rect class="box gw" x="260" y="164" width="140" height="28" style="opacity:0.45"/><text class="t-sm t-c t-muted" x="330" y="178">Tuition fees (−1,7)</text>

  <!-- Bước 3 -->
  <path class="ln" d="M400,58 L424,42"/><path class="ln-ext" d="M400,58 L424,82"/>
  <path class="ln" d="M400,140 L424,128"/><path class="ln-ext" d="M400,140 L424,166"/>
