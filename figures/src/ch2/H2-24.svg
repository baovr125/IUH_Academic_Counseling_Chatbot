  <path class="ln" d="M210,74 L258,58"/><path class="ln-ext" d="M210,74 L258,96"/>
  <path class="ln" d="M210,137 L258,140"/><path class="ln-ext" d="M210,137 L258,178"/>
  <rect class="box fe" x="260" y="44" width="140" height="28" style="stroke-width:2.4"/><text class="t-sm t-c" x="330" y="58">The tuition (−0,7)</text>
