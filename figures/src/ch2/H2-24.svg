  <path class="ln" d="M64,137 L108,74"/><path class="ln" d="M64,137 L108,137"/><path class="ln-ext" d="M64,137 L108,200"/>
  <rect class="box fe" x="110" y="60" width="100" height="28" style="stroke-width:2.4"/><text class="t-sm t-c" x="160" y="74">The (−0,4)</text>
  <rect class="box fe" x="110" y="123" width="100" height="28" style="stroke-width:2.4"/><text class="t-sm t-c" x="160" y="137">Tuition (−0,9)</text>
  <rect class="box gw" x="110" y="186" width="100" height="28" style="opacity:0.45"/><text class="t-sm t-c t-muted" x="160" y="200">Fee (−1,6)</text>

