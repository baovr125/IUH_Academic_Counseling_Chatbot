<!-- H2-15 Các bước tìm kiếm toàn văn trong PostgreSQL với ví dụ.
     Đối chiếu db/schema_complete.sql: fts_tokens = to_tsvector('simple', immutable_unaccent(...)) (dòng 120–121);
     websearch_to_tsquery('simple', unaccent(query)), ts_rank_cd (dòng 396–402).
     Kết quả ví dụ theo quy tắc của cấu hình 'simple' (chữ thường, không tách gốc từ, giữ mọi từ). -->
<svg xmlns="http://www.w3.org/2000/svg" width="586" height="248" viewBox="0 0 586 248">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text class="t-sm t-b t-muted" x="8" y="12">LẬP CHỈ MỤC (cột sinh tự động fts_tokens)</text>
  <rect class="box gw" x="8" y="22" width="140" height="44"/><text class="t-sm t-c t-muted" x="78" y="34">Đoạn văn bản</text><text class="t-sm t-c" x="78" y="52">“Học phí học kỳ 1”</text>
  <path class="ln" d="M148,44 L162,44"/>
  <rect class="box gw" x="164" y="22" width="150" height="44"/><text class="t-sm t-c t-mono" x="239" y="34">unaccent</text><text class="t-sm t-c" x="239" y="52">“Hoc phi hoc ky 1”</text>
  <path class="ln" d="M314,44 L328,44"/>
  <rect class="box infra" x="330" y="22" width="250" height="44"/><text class="t-sm t-c t-mono" x="455" y="34">to_tsvector('simple', …)</text><text class="t-sm t-c t-mono" x="455" y="52">'1':5 'hoc':1,3 'ky':4 'phi':2</text>

  <text class="t-sm t-b t-muted" x="8" y="96">TRUY VẤN</text>
  <rect class="box fe" x="8" y="106" width="140" height="44"/><text class="t-sm t-c t-muted" x="78" y="118">Câu hỏi</text><text class="t-sm t-c" x="78" y="136">“học phí”</text>
  <path class="ln" d="M148,128 L162,128"/>
  <rect class="box fe" x="164" y="106" width="150" height="44"/><text class="t-sm t-c t-mono" x="239" y="118">unaccent</text><text class="t-sm t-c" x="239" y="136">“hoc phi”</text>
  <path class="ln" d="M314,128 L328,128"/>
  <rect class="box fe" x="330" y="106" width="250" height="44"/><text class="t-sm t-c t-mono" x="455" y="118">websearch_to_tsquery</text><text class="t-sm t-c t-mono" x="455" y="136">'hoc' &amp; 'phi'</text>

  <path class="ln" d="M470,66 L470,104" style="display:none"/>
  <path class="ln" d="M455,150 L455,178"/>
  <path class="ln" d="M578,44 L582,44 L582,192 L572,192" style="stroke-dasharray:3 3"/>
  <rect class="box chat" x="190" y="180" width="380" height="58"/>
  <text class="t-sm t-c" x="380" y="196">Lọc: fts_tokens @@ tsquery (đoạn chứa đủ “hoc” và “phi”)</text>
  <text class="t-sm t-c" x="380" y="214">Xếp hạng: ts_rank_cd theo mật độ phủ</text>
  <text class="t-sm t-c t-muted" x="380" y="230">“hoc” (1) và “phi” (2) đứng liền nhau → phủ ngắn → điểm cao</text>
  <text class="t-sm t-muted" x="8" y="196">Cấu hình 'simple':</text>
  <text class="t-sm t-muted" x="8" y="212">chữ thường, không tách</text>
  <text class="t-sm t-muted" x="8" y="228">gốc từ, không bỏ từ dừng</text>
</svg>
