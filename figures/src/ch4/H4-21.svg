  </defs>

  <!-- Văn bản mô hình sinh -->
  <rect class="group" x="4" y="4" width="344" height="364"/>
  <text class="t-sm t-b" x="14" y="18">Văn bản mô hình sinh ra (lưu vào CSDL và log)</text>

  <!-- khối thinking -->
  <rect class="box flash" x="14" y="30" width="324" height="132"/>
  <text class="t-mono" x="22" y="44">&lt;thinking&gt;</text>
  <text class="t-mono" x="22" y="59">&lt;doc_relevance&gt;PARTIAL&lt;/doc_relevance&gt;</text>
  <text class="t-mono" x="22" y="74">&lt;conflict_detected&gt;NO&lt;/conflict_detected&gt;</text>
