  <text class="t-sm" x="22" y="235">- Bước 2: Kiểm tra thời khóa biểu … đăng ký …</text>
  <text class="t-sm" x="22" y="251">- Bước 3: Theo dõi thông báo đăng ký bổ sung …</text>
  <text class="t-sm" x="22" y="269">Hiện tại mình chưa tìm thấy thông tin chính thức</text>
  <text class="t-sm" x="22" y="285">về cách xử lý khi môn học bị trùng lịch. …</text>

  <!-- gợi ý -->
  <rect class="box gw" x="14" y="302" width="324" height="58"/>
  <text class="t-mono" x="22" y="316">&lt;suggested_queries&gt;</text>
