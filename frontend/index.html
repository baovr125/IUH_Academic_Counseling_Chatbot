<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <title>IUH Portal AI</title>
    <!-- Gắn class "dark" trước lần sơn đầu tiên để không nháy nền trắng khi tải lại ở chế độ tối.
         Phải khớp với applyAppTheme() trong src/context/SettingsContext.tsx (tests/themeBootstrap.test.ts kiểm tra). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("app_theme") || "light";
          var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
