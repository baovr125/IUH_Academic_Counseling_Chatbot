server {
    listen 80;
    server_name localhost;

    # Header bảo mật cơ bản. Referrer-Policy hạn chế rò rỉ URL (có thể chứa ?token= cho SSE) sang site khác.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=()" always;

    # index.html KHÔNG được cache: nếu không, trình duyệt giữ bản cũ (nó trỏ tới bundle JS cũ) nên người dùng không
    # thấy tính năng mới sau khi triển khai. Lưu ý: add_header trong location sẽ thay thế add_header ở cấp server,
    # nên các header bảo mật được lặp lại ở từng location.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
    }

    # Tệp trong /assets có hash trong tên (đổi nội dung thì đổi tên) nên cache lâu được.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
    }

    location /api {
        proxy_pass http://kong-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

