# Chạy: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# (--env-file để Compose nội suy các biến ${...} bên dưới từ .env.prod)
services:
  kong-gateway:
    image: kong:3.9.3
    container_name: iuh_kong_gateway_prod
    entrypoint: ["/bin/sh", "/etc/kong-template/kong-entrypoint.sh"]
    environment:
      KONG_DATABASE: "off"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Hãy đặt JWT_SECRET_KEY trong .env.prod}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Hãy đặt PUBLIC_ORIGIN (vd. https://chatbot.example.edu.vn) trong .env.prod}
      KONG_TRUSTED_IPS: 172.16.0.0/12
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
    ports:
      - "8000:8000"   # Backend API Gateway
      - "8443:8443"
    volumes:
      - ./gateway/kong.template.yml:/etc/kong-template/kong.template.yml:ro
      - ./gateway/kong-entrypoint.sh:/etc/kong-template/kong-entrypoint.sh:ro
    depends_on:
      - auth-service
      - academic-chatbot-service
      - realtime-translation-service
      - doc-translation-service
      - flashcard-service
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: iuh_rabbitmq_prod
    # Không publish cổng: chỉ các service trong mạng Docker được truy cập RabbitMQ.
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?đặt trong .env.prod}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?đặt trong .env.prod}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: iuh_redis_prod
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: iuh_minio_prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?đặt trong .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?đặt trong .env.prod}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_prod:/data
    restart: unless-stopped

  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: iuh_vllm_prod
    command: --model QuantTrio/Qwen3.6-35B-A3B-AWQ --quantization awq --gpu-memory-utilization 0.80 --max-model-len 8192
    volumes:
      - hf_cache_prod:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    shm_size: '8gb'

  auth-service:
    image: auth-service:latest
    build:
      context: ./services/auth_service
    container_name: iuh_auth_service_prod
    env_file:
      - .env.prod
    restart: unless-stopped

  academic-chatbot-service:
    image: academic-chatbot-service:latest
    build:
      context: ./services/academic_chatbot_service
    container_name: iuh_academic_chatbot_service_prod
    env_file:
      - .env.prod
    depends_on:
      - redis
      - vllm-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./logs/academic_chatbot:/app/logs/academic_chatbot
      - ./hf_models:/app/hf_models
      - ./data/ingestion:/app/app/data_ingestion/data
    restart: unless-stopped

  realtime-translation-service:
    image: realtime-translation-service:latest
    build:
      context: ./services/realtime_translation_service
    container_name: iuh_realtime_translation_service_prod
    gpus: all
    environment:
      NLLB_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    env_file:
      - .env.prod
    depends_on:
      - redis
      - minio
      - rabbitmq
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  doc-translation-service:
    image: doc-translation-service:latest
    build:
      context: ./services/doc_translation_service
    container_name: iuh_doc_translation_service_prod
    env_file:
      - .env.prod
    depends_on:
      - rabbitmq
      - redis
      - minio
    restart: unless-stopped

  doc-translation-worker:
    image: doc-translation-worker:latest
    build:
      context: ./services/doc_translation_service
    container_name: iuh_doc_translation_worker_prod
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env.prod
    depends_on:
      - rabbitmq
      - redis
      - minio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  flashcard-service:
    image: flashcard-service:latest
    build:
      context: ./services/flashcard_service
    container_name: iuh_flashcard_service_prod
    env_file:
      - .env.prod
    depends_on:
      - rabbitmq
    restart: unless-stopped

  frontend:
    image: frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: iuh_frontend_prod
    ports:
      - "80:80"
    depends_on:
      - kong-gateway
    restart: unless-stopped

volumes:
  minio_data_prod:
  hf_cache_prod:
