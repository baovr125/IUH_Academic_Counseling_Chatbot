services:
  kong-gateway:
    image: kong:latest
    container_name: iuh_kong_gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_DNS_STALE_TTL: 0
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 1
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ./gateway/kong.yml:/usr/local/kong/declarative/kong.yml
    depends_on:
      - auth-service
      - academic-chatbot-service
      - realtime-translation-service
      - doc-translation-service
      - flashcard-service
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: iuh_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: iuh_redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M

  minio:
    image: minio/minio:latest
    container_name: iuh_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  auth-service:
    image: auth-service:latest
    build:
      context: ./services/auth_service
    container_name: iuh_auth_service
    ports:
      - "8001:8001"
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 256M

  academic-chatbot-service:
    image: academic-chatbot-service:latest
    build:
      context: ./services/academic_chatbot_service
    container_name: iuh_academic_chatbot_service
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3.5G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  realtime-translation-service:
    image: realtime-translation-service:latest
    build:
      context: ./services/realtime_translation_service
    container_name: iuh_realtime_translation_service
    ports:
      - "8003:8003"
    env_file:
      - .env
    depends_on:
      - redis
      - minio
      - rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2.0G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  doc-translation-service:
    image: doc-translation-service:latest
    build:
      context: ./services/doc_translation_service
    container_name: iuh_doc_translation_service
    ports:
      - "8004:8004"
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - redis
      - minio
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  doc-translation-worker:
    image: doc-translation-worker:latest
    build:
      context: ./services/doc_translation_service
    container_name: iuh_doc_translation_worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - redis
      - minio
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2.5G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  flashcard-service:
    image: flashcard-service:latest
    build:
      context: ./services/flashcard_service
    container_name: iuh_flashcard_service
    ports:
      - "8005:8005"
    env_file:
      - .env
    depends_on:
      - rabbitmq
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 256M

  frontend:
    image: frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: iuh_frontend
    ports:
      - "5173:80"
    depends_on:
      - kong-gateway
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

volumes:
  minio_data:
