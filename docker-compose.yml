services:
  kong-gateway:
    image: kong:3.9.3
    container_name: iuh_kong_gateway
    entrypoint: ["/bin/sh", "/etc/kong-template/kong-entrypoint.sh"]
    environment:
      KONG_DATABASE: "off"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Hãy đặt JWT_SECRET_KEY trong file .env (chuỗi ngẫu nhiên >= 32 ký tự)}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      # Tin X-Forwarded-For chỉ từ dải mạng Docker (nginx của frontend) để rate-limit theo IP thật.
      KONG_TRUSTED_IPS: 172.16.0.0/12
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_DNS_STALE_TTL: 0
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 1
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ./gateway/kong.template.yml:/etc/kong-template/kong.template.yml:ro
      - ./gateway/kong-entrypoint.sh:/etc/kong-template/kong-entrypoint.sh:ro
    depends_on:
      - auth-service
      - academic-chatbot-service
      - realtime-translation-service
#      - doc-translation-service
      - flashcard-service
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: iuh_rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: iuh_redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M

  minio:
    image: pgsty/minio:latest
    container_name: iuh_minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  auth-service:
    image: auth-service:latest
    build:
      context: ./services/auth_service
    container_name: iuh_auth_service
    # Không publish cổng: mọi truy cập từ ngoài phải đi qua Kong (cổng 8000).
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 256M

  academic-chatbot-service:
    image: academic-chatbot-service:latest
    build:
      context: ./services/academic_chatbot_service
    container_name: iuh_academic_chatbot_service
    env_file:
      - .env
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4.5G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./logs/academic_chatbot:/app/logs/academic_chatbot
      - ./services/academic_chatbot_service/app:/app/app
      - ./hf_models:/app/hf_models
      - ./data/ingestion:/app/app/data_ingestion/data

  realtime-translation-service:
    image: realtime-translation-service:latest
    build:
      context: ./services/realtime_translation_service
    container_name: iuh_realtime_translation_service
    gpus: all
    environment:
      NLLB_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    env_file:
      - .env
    depends_on:
      - redis
      - minio
      - rabbitmq
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3.5G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

