  flashcard-service:
    image: flashcard-service:latest
    build:
      context: ./services/flashcard_service
    container_name: iuh_flashcard_service
    ports:
      - "8005:8005"
    env_file:
      - .env
    depends_on:
      - rabbitmq
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 512M

  frontend:
    image: frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: iuh_frontend
    ports:
      - "5173:80"
    depends_on:
      - kong-gateway
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

volumes:
  minio_data:
